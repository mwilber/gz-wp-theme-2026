name: Deploy GreenZeta 2026

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy from origin
        required: true
        type: string

permissions: {}

concurrency:
  group: greenzeta-2026-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update the server checkout over SSH
        shell: bash
        env:
          DEPLOY_BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          # Validate before passing the branch through the remote shell.
          if [[ ! "$DEPLOY_BRANCH" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$ ]]; then
            echo 'Use a branch name containing letters, numbers, dots, underscores, slashes, or hyphens.' >&2
            exit 1
          fi
          git check-ref-format --branch "$DEPLOY_BRANCH" >/dev/null
          : "${DEPLOY_SSH_KEY:?Add the DEPLOY_SSH_KEY repository secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Add the DEPLOY_KNOWN_HOSTS repository secret}"
          : "${DEPLOY_USER:?Add the DEPLOY_USER repository secret}"
          : "${DEPLOY_DOMAIN:?Add the DEPLOY_DOMAIN repository secret}"
          : "${DEPLOY_PATH:?Add the DEPLOY_PATH repository secret}"

          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/greenzeta-2026-deploy.XXXXXX")
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          # Escape single quotes so the path stays one literal remote argument.
          deploy_path_quoted=${DEPLOY_PATH//\'/\'\\\'\'}

          ssh -T -p 22 \
            -l "$DEPLOY_USER" \
            -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$DEPLOY_DOMAIN" "bash -s -- '$DEPLOY_BRANCH' '$deploy_path_quoted'" <<'REMOTE'
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=yes'
          branch=$1
          deploy_path=$2
          # Quoted paths do not expand a leading tilde automatically.
          if [[ "$deploy_path" == '~/'* ]]; then
            deploy_path="$HOME/${deploy_path:2}"
          fi
          cd -- "$deploy_path"

          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo 'Deployment stopped: the server checkout has tracked-file changes.' >&2
            exit 1
          fi

          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          if git show-ref --verify --quiet "refs/heads/$branch"; then
            if ! git merge-base --is-ancestor "refs/heads/$branch" "refs/remotes/origin/$branch"; then
              echo 'Deployment stopped: the server branch has commits absent from origin.' >&2
              exit 1
            fi
            git switch "$branch"
          else
            git switch --create "$branch" --track "origin/$branch"
          fi
          git merge --ff-only "refs/remotes/origin/$branch"
          printf 'Deployed branch: %s\n' "$branch"
          git log -1 --format='%h %s'
          REMOTE
